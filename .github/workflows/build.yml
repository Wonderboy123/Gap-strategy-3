name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip zip unzip git build-essential python3-dev libssl-dev libffi-dev libsqlite3-dev libbz2-dev libncursesw5-dev zlib1g-dev libreadline-dev libltdl-dev libtool autoconf pkg-config
          pip install --upgrade pip
          pip install buildozer cython==0.29.33 virtualenv
      - name: Build APK
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vol100-Gap-APK
          path: bin/*.apk
          if-no-files-found: warn
