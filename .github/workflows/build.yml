name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y libssl-dev libffi-dev openjdk-17-jdk zip unzip
          pip install buildozer cython==0.29.36
      - name: Build
        run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Gap-strategy-APK
          path: bin/*.apk
